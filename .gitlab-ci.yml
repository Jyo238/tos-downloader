stages:
  - build
  - release

image: python:3.10

before_script:
  - pip install -r requirements.txt

build_exe:
  stage: build
  script:
    - pyinstaller --noconsole --onefile tos_downloader_gui.py
  artifacts:
    paths:
      - dist/tos_downloader_gui.exe

release:
  stage: release
  script:
    - echo "Release created"
  release:
    name: "Release $CI_COMMIT_TAG"
    tag_name: "$CI_COMMIT_TAG"
    description: "自動打包的下載器 auto-downloader"
    assets:
      links:
        - name: tos_downloader_gui.exe
          url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/raw/dist/tos_downloader_gui.exe"
  only:
    - tags
